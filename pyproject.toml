[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmf-evals"
version = "0.1.0"
description = "Eval-first harness for the folded paid media agent (Stage 0)"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pmf_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
